name: Merge Gate
description: Evaluate a pull request against repository-owned merge requirements.

inputs:
  github-token:
    description: Read-only GitHub token for PR, contents, checks, and statuses.
    required: true
  policy-path:
    description: Policy file fetched from the pull request's base commit.
    required: false
    default: .merge-gate/policy.toml
  ci-result:
    description: Result of the target repository's prerequisite CI job.
    required: false
    default: unknown
  org-policy-repo:
    description: >-
      Optional owner/name of a repository holding a shared organization
      baseline policy. Leave unset to run with the repository policy alone.
    required: false
    default: ""
  org-policy-ref:
    description: Branch, tag, or SHA to read the organization policy from.
    required: false
    default: main
  org-policy-path:
    description: Organization policy path within org-policy-repo.
    required: false
    default: .merge-gate/organization.toml
  anthropic-api-key:
    description: Provider key required for the live Claude risk judgment.
    required: true
  execution-token:
    description: >-
      Optional GitHub App or fine-grained token used only to enable native
      auto-merge after a verified candidate decision and policy opt-in.
    required: false
    default: ""

outputs:
  action:
    description: Final advisory action.
    value: ${{ steps.merge-gate.outputs.action }}
  reason:
    description: Human-readable reason for the action.
    value: ${{ steps.merge-gate.outputs.reason }}
  execution-status:
    description: Auto-merge execution status such as disabled, enabled, draft, or failed.
    value: ${{ steps.merge-gate.outputs.execution_status }}
  execution-reason:
    description: Human-readable explanation of the execution outcome.
    value: ${{ steps.merge-gate.outputs.execution_reason }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install action dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check -r "$MERGE_GATE_REQUIREMENTS"
      env:
        MERGE_GATE_REQUIREMENTS: ${{ github.action_path }}/requirements-action.txt

    - name: Evaluate pull request
      id: merge-gate
      shell: bash
      run: >-
        python "$MERGE_GATE_ACTION_PATH/github_action.py"
        --policy-path "$MERGE_GATE_POLICY_PATH"
        --ci-result "$MERGE_GATE_CI_RESULT"
        --org-policy-repo "$MERGE_GATE_ORG_POLICY_REPO"
        --org-policy-ref "$MERGE_GATE_ORG_POLICY_REF"
        --org-policy-path "$MERGE_GATE_ORG_POLICY_PATH"
      env:
        MERGE_GATE_ACTION_PATH: ${{ github.action_path }}
        MERGE_GATE_POLICY_PATH: ${{ inputs.policy-path }}
        MERGE_GATE_CI_RESULT: ${{ inputs.ci-result }}
        MERGE_GATE_ORG_POLICY_REPO: ${{ inputs.org-policy-repo }}
        MERGE_GATE_ORG_POLICY_REF: ${{ inputs.org-policy-ref }}
        MERGE_GATE_ORG_POLICY_PATH: ${{ inputs.org-policy-path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MERGE_GATE_EXECUTION_TOKEN: ${{ inputs.execution-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
