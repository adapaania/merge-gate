[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-gate"
version = "0.2.0"
description = "An evaluation framework and advisory policy gate for agent-authored pull requests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "altair>=6.0",
  "anthropic>=0.70",
  "httpx>=0.28",
  "pandas>=2.2",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "streamlit>=1.60",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.setuptools]
py-modules = [
  "engine",
  "evaluate_judge",
  "evaluation",
  "execution_trace",
  "feedback",
  "github_action",
  "github_pr",
  "judgment",
  "llm_judge",
  "model",
  "policies",
  "policy_retrieval",
  "project_policy",
  "run",
  "scorer",
  "streamlit_app",
  "verifier",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
